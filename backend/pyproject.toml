[project]
name = "project-management-backend"
version = "0.1.0"
description = "Backend for the Project Management MVP"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=25,<26",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-cov>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/openrouter_smoke.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
