[project]
name = "project-management-backend"
version = "0.1.0"
description = "Backend for the Project Management MVP"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.115,<1",
]

[dependency-groups]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
